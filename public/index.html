<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexvya Store — Assistant IA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <p class="eyebrow">Nexvya Store</p>
            <h1>Une aide rapide et claire, dès maintenant.</h1>
            <p>Notre assistant boutique est disponible en bas à droite pour répondre à toutes vos questions.</p>
        </section>
    </main>

    <div id="chat-widget" class="chat-widget">
        <button id="chat-button" class="chat-button" aria-label="Ouvrir le chat">Besoin d'aide ? 💬</button>

        <div id="chat-window" class="chat-window hidden" role="dialog" aria-label="Chat d'assistance">
            <div class="chat-header">
                <div class="chat-header-main">
                    <div class="chat-avatar">🤖</div>
                    <div>
                        <p class="chat-title">Assistant Nexvya Store</p>
                        <p class="chat-status">En ligne</p>
                    </div>
                </div>
                <button id="close-chat" class="close-button" aria-label="Fermer le chat">✕</button>
            </div>

            <div id="chat-messages" class="chat-messages">
                <div class="message bot-message">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <p>Bonjour ! Je suis votre assistant Nexvya Store. Comment puis-je vous aider aujourd'hui ?</p>
                    </div>
                </div>
            </div>

            <div class="chat-input-container">
                <textarea id="chat-input" class="chat-input" placeholder="Tapez votre message..." rows="1"></textarea>
                <button id="send-button" class="send-button" aria-label="Envoyer">➤</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
